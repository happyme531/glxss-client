[project]
name = "glxss-client"
version = "0.2.0"
description = "USB tools for LLVision GLXSS Me smart glasses"
requires-python = ">=3.10"
dependencies = ["pyusb>=1.3.1", "libusb1>=3.3", "libusb-package>=1.0.26; platform_system == 'Windows'", "pillow>=11"]

[project.optional-dependencies]
dashboard = ["PyQt6>=6.2"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
